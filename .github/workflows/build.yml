name: Build Firmware

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -oP '#define FW_VERSION "\K[^"]+' therm.ino)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Firmware verzió: $VERSION"

      - name: Copy and rename firmware
        run: |
          cp therm.ino therm-${{ steps.version.outputs.version }}.ino
          ls -lh therm-*.ino

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: therm-firmware-${{ steps.version.outputs.version }}
          path: therm-${{ steps.version.outputs.version }}.ino
          retention-days: 90

      - name: Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/claude/')
        uses: softprops/action-gh-release@v1
        with:
          files: therm-${{ steps.version.outputs.version }}.ino
          tag_name: v${{ steps.version.outputs.version }}
          name: Therm v${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/heads/main') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
